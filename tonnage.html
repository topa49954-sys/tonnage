<title>Тоннаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@600;700;800&display=swap">

<style>
:root{
  --ink:#101319;
  --ink-2:#3d4655;
  --ink-3:#6c7789;
  --paper:#e9edf2;
  --card:#ffffff;
  --card-2:#f4f6f9;
  --line:#d3dae3;
  --line-soft:#e3e8ee;
  --accent:#1b5fd9;
  --accent-ink:#ffffff;
  --accent-soft:#e2ebfb;
  --signal:#c98400;
  --signal-soft:#fdf0d6;
  --good:#237a4c;
  --good-soft:#dff0e6;
  --bad:#c01f34;
  --bad-soft:#fbe2e5;
  --shadow:0 1px 2px rgba(16,19,25,.06), 0 8px 24px -14px rgba(16,19,25,.30);
  --shadow-lift:0 2px 6px rgba(16,19,25,.10), 0 18px 40px -20px rgba(16,19,25,.40);
  --r:14px;
  --r-s:10px;
  --tabh:62px;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#eef2f7;
    --ink-2:#aab4c3;
    --ink-3:#7b8598;
    --paper:#0c0f14;
    --card:#161b23;
    --card-2:#1d232d;
    --line:#2a323e;
    --line-soft:#232a34;
    --accent:#5b93ff;
    --accent-ink:#0c0f14;
    --accent-soft:#1a2740;
    --signal:#ffc24a;
    --signal-soft:#332711;
    --good:#4cc07f;
    --good-soft:#11291d;
    --bad:#ff6b7d;
    --bad-soft:#2d1319;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.9);
    --shadow-lift:0 2px 8px rgba(0,0,0,.6), 0 20px 46px -22px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --ink:#eef2f7;
  --ink-2:#aab4c3;
  --ink-3:#7b8598;
  --paper:#0c0f14;
  --card:#161b23;
  --card-2:#1d232d;
  --line:#2a323e;
  --line-soft:#232a34;
  --accent:#5b93ff;
  --accent-ink:#0c0f14;
  --accent-soft:#1a2740;
  --signal:#ffc24a;
  --signal-soft:#332711;
  --good:#4cc07f;
  --good-soft:#11291d;
  --bad:#ff6b7d;
  --bad-soft:#2d1319;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.9);
  --shadow-lift:0 2px 8px rgba(0,0,0,.6), 0 20px 46px -22px rgba(0,0,0,1);
}

*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--tabh) + 28px)}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);
  margin:0 -16px;padding:14px 16px 10px;
  border-bottom:1px solid transparent;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
}
.topbar.scrolled{border-bottom-color:var(--line-soft)}
.screen-title{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;margin:0}
.screen-sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.brandmark{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;padding-bottom:4px}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:center;gap:0;
  background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line-soft);
  padding:0 8px calc(6px + env(safe-area-inset-bottom,0px));
}
.tabbar-inner{display:flex;width:100%;max-width:560px}
.tab{
  flex:1;background:none;border:0;padding:8px 2px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);font-size:10.5px;font-weight:500;letter-spacing:.01em;
  border-radius:var(--r-s);
}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] svg{stroke-width:2.1}

section[hidden]{display:none!important}

/* ---------- primitives ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.h2{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.01em;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:0}

.btn{
  border:1px solid var(--line);background:var(--card);border-radius:var(--r-s);
  padding:10px 14px;font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-wide{width:100%}
.btn-s{padding:7px 11px;font-size:13px;border-radius:9px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 2px 16px;margin:0 -16px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}

.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--card-2);color:var(--ink-3);white-space:nowrap}
.badge.on{background:var(--good-soft);color:var(--good)}
.badge.hot{background:var(--signal-soft);color:var(--signal)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink-3);font-weight:500}
.field input,.field select{
  background:var(--card-2);border:1px solid var(--line-soft);border-radius:var(--r-s);
  padding:10px 12px;width:100%;font-family:var(--mono);font-variant-numeric:tabular-nums;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- today ---------- */
.hero{
  background:var(--ink);color:var(--paper);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow-lift);position:relative;overflow:hidden;
}
:root[data-theme="dark"] .hero,
:root:not([data-theme="light"]) .hero{border:1px solid var(--line)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .hero{border:0}}
.hero .eyebrow{color:color-mix(in srgb,var(--paper) 62%,transparent)}
.hero-title{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.08;letter-spacing:-.025em;margin:6px 0 4px}
.hero-sub{font-size:13px;color:color-mix(in srgb,var(--paper) 70%,transparent)}
.hero-stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.hero-stat b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.1}
.hero-stat span{font-size:11px;color:color-mix(in srgb,var(--paper) 58%,transparent)}
.hero .btn{margin-top:16px;background:var(--paper);color:var(--ink);border-color:transparent}

.exrow{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;
}
.exrow-head{display:flex;gap:12px;align-items:center;padding:13px 14px;width:100%;border:0;background:none;text-align:left}
.exrow-fig{width:46px;height:46px;flex:none;border-radius:9px;background:var(--card-2);display:grid;place-items:center;overflow:hidden}
.exrow-fig svg{width:100%;height:100%}
.exrow-name{font-weight:600;font-size:14.5px;line-height:1.25}
.exrow-meta{font-size:12px;color:var(--ink-3);margin-top:2px;font-family:var(--mono)}
.exrow-state{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.dots{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--good)}
.exrow-body{border-top:1px solid var(--line-soft);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}

.setline{display:grid;grid-template-columns:26px 1fr 1fr 42px;gap:8px;align-items:center}
.setline .sn{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-align:center}
.setline input{
  background:var(--card-2);border:1px solid var(--line-soft);border-radius:9px;
  padding:9px 8px;width:100%;text-align:center;
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500;
}
.setline.done input{background:var(--good-soft);border-color:transparent;color:var(--good)}
.setline .tick{
  border:1px solid var(--line);background:var(--card);border-radius:9px;height:38px;
  display:grid;place-items:center;padding:0;
}
.setline.done .tick{background:var(--good);border-color:var(--good)}
.setline .tick svg{width:17px;height:17px;fill:none;stroke:var(--ink-3);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.setline.done .tick svg{stroke:#fff}
.setcap{display:grid;grid-template-columns:26px 1fr 1fr 42px;gap:8px;font-size:10.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.setcap span{text-align:center}

.hint{font-size:12.5px;color:var(--ink-2);background:var(--card-2);border-radius:9px;padding:9px 11px;line-height:1.4}
.hint b{color:var(--ink)}

/* ---------- rest timer ---------- */
.timerbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabh) + 10px + env(safe-area-inset-bottom,0px));
  z-index:45;width:min(528px,calc(100% - 32px));
  background:var(--ink);color:var(--paper);border-radius:var(--r);
  box-shadow:var(--shadow-lift);padding:11px 13px;
  display:flex;align-items:center;gap:12px;
}
.timerbar .ring{width:40px;height:40px;flex:none}
.timerbar .ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.timerbar .t-left{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.timerbar .t-lab{font-size:11px;color:color-mix(in srgb,var(--paper) 60%,transparent);margin-top:2px}
.timerbar button{background:color-mix(in srgb,var(--paper) 16%,transparent);border:0;color:var(--paper);border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:600}

/* ---------- library ---------- */
.lib-item{display:flex;gap:12px;align-items:center;padding:11px 13px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);width:100%;border:0;text-align:left}
.lib-fig{width:52px;height:52px;flex:none;border-radius:9px;background:var(--card-2);overflow:hidden}
.lib-fig svg{width:100%;height:100%}

.sheet-scrim{position:fixed;inset:0;background:rgba(8,10,14,.55);z-index:60;opacity:0;transition:opacity .18s}
.sheet-scrim.open{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:var(--paper);border-radius:18px 18px 0 0;
  max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));
  box-shadow:var(--shadow-lift);
  transform:translateY(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
}
.sheet.open{transform:translateY(0)}
.sheet-inner{max-width:560px;margin:0 auto}
.sheet-grab{position:sticky;top:0;background:var(--paper);padding:10px 0 6px;z-index:2}
.sheet-grab i{display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}

.figbox{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;position:relative}
.figbox svg.fig{width:100%;height:auto;display:block;aspect-ratio:1/1;max-width:100%}
.scrub{width:100%;margin-top:6px;accent-color:var(--accent)}

.cuelist{counter-reset:c;display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.cuelist li{display:flex;gap:10px;font-size:13.5px;line-height:1.45}
.cuelist li::before{
  counter-increment:c;content:counter(c);
  font-family:var(--mono);font-size:11px;font-weight:600;
  width:20px;height:20px;flex:none;border-radius:6px;
  background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;margin-top:1px;
}
.errlist{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.errlist li{display:flex;gap:10px;font-size:13.5px;line-height:1.45}
.errlist li::before{content:"✕";font-size:11px;font-weight:700;width:20px;height:20px;flex:none;border-radius:6px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;margin-top:1px}

/* ---------- plan ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wday{border-radius:9px;padding:8px 2px;text-align:center;background:var(--card-2);border:1px solid transparent}
.wday .d{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
.wday .k{font-family:var(--display);font-weight:700;font-size:14px;margin-top:3px;line-height:1}
.wday.work{background:var(--accent-soft);color:var(--accent)}
.wday.work .d{color:var(--accent)}
.wday.today{border-color:var(--ink)}
.prog-opt{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:var(--r);border:1.5px solid var(--line-soft);background:var(--card);width:100%;text-align:left}
.prog-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.prog-opt .pk{font-family:var(--display);font-weight:700;font-size:15px}

/* ---------- charts ---------- */
.chart-wrap{position:relative}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--mono);font-size:9px;fill:var(--ink-3)}
.tip{
  position:absolute;pointer-events:none;z-index:5;
  background:var(--ink);color:var(--paper);border-radius:8px;
  padding:6px 9px;font-size:11.5px;font-family:var(--mono);white-space:nowrap;
  transform:translate(-50%,-125%);opacity:0;transition:opacity .1s;box-shadow:var(--shadow-lift);
}
.tip.on{opacity:1}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px}
.tile b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile span{font-size:11px;color:var(--ink-3);display:block;margin-top:3px}

/* ---------- plates ---------- */
.plateview{display:flex;align-items:center;justify-content:center;gap:3px;min-height:66px;padding:10px 0;flex-wrap:wrap}
.plate{border-radius:3px;display:grid;place-items:center;font-family:var(--mono);font-size:9px;font-weight:600;color:#fff;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.02em}
.sleeve{width:26px;height:7px;background:var(--line);border-radius:2px}

.nut-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.nut-row:last-child{border-bottom:0}
.nut-row b{font-family:var(--mono);font-size:17px;font-weight:600}
.bar-track{height:8px;border-radius:4px;background:var(--card-2);overflow:hidden;display:flex;margin-top:10px}
.bar-track i{display:block;height:100%}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
@media (max-width:360px){
  .hero-title{font-size:22px}
  .screen-title{font-size:20px}
}
</style>

<div class="app">
  <header class="topbar" id="topbar">
    <div>
      <h1 class="screen-title" id="scrTitle">Сегодня</h1>
      <div class="screen-sub" id="scrSub">—</div>
    </div>
    <div class="brandmark">Тоннаж</div>
  </header>

  <section id="scr-today"></section>
  <section id="scr-plan" hidden></section>
  <section id="scr-lib" hidden></section>
  <section id="scr-prog" hidden></section>
  <section id="scr-food" hidden></section>
</div>

<div class="timerbar" id="timerbar" hidden>
  <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="16" stroke="rgba(255,255,255,.2)"></circle>
    <circle id="ringFg" cx="20" cy="20" r="16" stroke="#F2A900" stroke-dasharray="100.5" stroke-dashoffset="0" transform="rotate(-90 20 20)"></circle>
  </svg>
  <div>
    <div class="t-left" id="tLeft">2:00</div>
    <div class="t-lab" id="tLab">Отдых между подходами</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:6px">
    <button id="tPlus">+30с</button>
    <button id="tSkip">Готов</button>
  </div>
</div>

<nav class="tabbar">
  <div class="tabbar-inner" id="tabbar" role="tablist"></div>
</nav>

<div class="sheet-scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-inner" id="sheetInner"></div></div>

<script>
/* =====================================================================
   ТОННАЖ — тренировочный дневник
   ===================================================================== */

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const el = (tag,attrs={},...kids)=>{
  const n=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(v===null||v===undefined||v===false)continue;
    if(k==='class')n.className=v;
    else if(k==='html')n.innerHTML=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat()){ if(k===null||k===undefined||k===false)continue;
    n.appendChild(typeof k==='object'?k:document.createTextNode(String(k))); }
  return n;
};
const pad=n=>String(n).padStart(2,'0');
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const fmtDate=k=>{const[y,m,d]=k.split('-');return `${d}.${m}`;};
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DOW_ORDER=[1,2,3,4,5,6,0]; // Пн..Вс

/* ============================ УПРАЖНЕНИЯ ============================
   Позы фигуры задаются углами сегментов.
   Угол 0° = вниз, 90° = вправо, 180° = вверх, 270° = влево.
   t (torso: таз→шея), h (бедро), s (голень), u (плечо), f (предплечье)
   ===================================================================== */

const EX = {
  squat:{
    n:'Приседания со штангой', en:'barbell back squat правильная техника',
    g:'Ноги', eq:'Штанга + стойки', tgt:'Квадрицепс, ягодичные, разгибатели спины',
    why:'Главное упражнение на массу ног и самый большой стимул для всего тела.',
    cues:[
      'Гриф лежит на верхней части трапеций, не на шее. Хват чуть шире плеч, локти смотрят вниз-назад.',
      'Снял со стоек — два шага назад, стопы на ширине плеч, носки развёрнуты на 15–30°.',

const SEG={torso:30,head:9,thigh:26,shin:26,foot:11,uarm:17,farm:17};
const RAD=a=>a*Math.PI/180;
const step=(p,a,l)=>({x:p.x+Math.sin(RAD(a))*l, y:p.y+Math.cos(RAD(a))*l});

function joints(P){
  const hip={x:0,y:0};
  const tA=180-P.t;
  const neck=step(hip,tA,SEG.torso);
  const head=step(neck,tA,SEG.head);
  const sh=step(hip,tA,SEG.torso*0.84);
  const el=step(sh,P.u,SEG.uarm);
  const wr=step(el,P.f,SEG.farm);
  const kn=step(hip,P.h,SEG.thigh);
  const an=step(kn,P.s,SEG.shin);
  const toe={x:an.x+SEG.foot, y:an.y+2};
  return {hip,neck,head,sh,el,wr,kn,an,toe};
}

  const cfg=ex.pose, P=cfg[which]||cfg.a;

  const out={};
  for(const k in j) out[k]={x:j[k].x+dx, y:j[k].y+dy};
  return out;
}

    svg.appendChild(load);
  }

  const A=placed(ex,'a'), B=placed(ex,'b');
  const D=q=>`M${q.x.toFixed(1)} ${q.y.toFixed(1)}`;
  const L=q=>`L${q.x.toFixed(1)} ${q.y.toFixed(1)}`;

  function draw(t){
    const j=lerpJ(A,B,t);
    spine.setAttribute('d',D(j.hip)+L(j.neck));
    leg.setAttribute('d',D(j.hip)+L(j.kn)+L(j.an)+L(j.toe));
    arm.setAttribute('d',D(j.sh)+L(j.el)+L(j.wr));
    head.setAttribute('cx',j.head.x); head.setAttribute('cy',j.head.y);
    const at = ex.pose.bar==='sh' ? j.sh : j.wr;
    if(load) load.setAttribute('transform',`translate(${at.x.toFixed(1)} ${at.y.toFixed(1)})`);
    if(cable){ cable.setAttribute('x1',ex.pose.cable[0]); cable.setAttribute('y1',ex.pose.cable[1]);
               cable.setAttribute('x2',j.wr.x); cable.setAttribute('y2',j.wr.y); }
  }
  draw(0);
  const rec={draw,animate,t:0,off:Math.random()*2};
  svg._fig=rec;
  if(animate) FIGS.add(rec);
  return svg;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let figT0=performance.now();
function figLoop(now){
  if(!reduceMotion){
    const p=((now-figT0)/2600);
    for(const f of FIGS){
      if(f.manual!==undefined) continue;
      const x=((p+f.off)%1);
      const tri=x<0.5?x*2:(1-x)*2;
      f.draw(tri<0?0:tri>1?1:(tri*tri*(3-2*tri)));
    }
  }
  requestAnimationFrame(figLoop);
}
requestAnimationFrame(figLoop);

function persist(what){

async function initDb(){

  try{
    const [st,bd,cu,ss]=await Promise.all([
      db.doc('app/settings').get(),
      db.doc('app/body').get(),
      db.doc('app/current').get(),
      db.collection('sessions').orderBy('id').limit(500).get()
    ]);
    if(st.exists) S.settings={...S.settings,...st.data(),profile:{...S.settings.profile,...(st.data().profile||{})}};
    if(bd.exists) S.body={...S.body,...(bd.data().e||{})};
    if(cu.exists && cu.data().v) S.current=cu.data().v;
    if(ss.size){
      const seen=new Set(S.sessions.map(x=>x.id));
      ss.docs.forEach(d=>{const v=d.data(); if(v&&v.id&&!seen.has(v.id)) S.sessions.push(v);});
      S.sessions.sort((a,b)=>a.id<b.id?-1:1);
    }
    S.dbReady=true;
    lsSet('settings',S.settings); lsSet('body',S.body); lsSet('sessions',S.sessions); lsSet('current',S.current);

const prog=()=>PROGRAMS[S.settings.programId]||PROGRAMS.fb3;
function scheduledKey(dow){ return prog().sched[dow]||null; }

function nextWorkoutKey(){
  const keys=Object.keys(prog().w);
  const doneKeys=S.sessions.filter(s=>s.programId===S.settings.programId).map(s=>s.dayKey);
  const last=doneKeys[doneKeys.length-1];
  if(!last) return keys[0];
  const i=keys.indexOf(last);
  return keys[(i+1)%keys.length];
}
function todayPlanKey(){
  const dow=new Date().getDay();
  return scheduledKey(dow)||null;
}
function lastPerf(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i], e=s.entries?.[exId];
    if(e&&e.some(x=>x&&x.done)) return {date:s.date,sets:e.filter(x=>x&&x.done)};
  }
  return null;
}
function bestSet(exId){
  let best=null;
  for(const s of S.sessions){
    for(const x of (s.entries?.[exId]||[])){
      if(x&&x.done&&x.w>0){ if(!best||x.w>best.w||(x.w===best.w&&x.r>best.r)) best={...x,date:s.date}; }
    }
  }
  return best;
}
const e1rm=(w,r)=> r>0? w*(1+r/30) : 0;

function sessionTonnage(s){
  let t=0;
  for(const k in (s.entries||{})) for(const x of s.entries[k]) if(x&&x.done) t+=(x.w||0)*(x.r||0);
  return t;
}
function startSession(dayKey){
  const w=prog().w[dayKey];
  const entries={};
  w.ex.forEach(item=>{ entries[item.id]=Array.from({length:item.sets},()=>({w:'',r:'',done:false})); });
  S.current={id:'s-'+todayKey().replace(/-/g,'')+'-'+pad(new Date().getHours())+pad(new Date().getMinutes()),
             date:todayKey(),programId:S.settings.programId,dayKey,entries,startedAt:Date.now()};
  persist('current'); render();
}
function finishSession(){
  if(!S.current) return;
  const s={...S.current,finishedAt:Date.now()};
  for(const k in s.entries) s.entries[k]=s.entries[k].filter(x=>x.done);
  const any=Object.values(s.entries).some(a=>a.length);
  if(any){ S.sessions.push(s); S.sessions.sort((a,b)=>a.id<b.id?-1:1); persist('sessions'); }
  S.current=null; persist('current'); stopTimer(); render(); go('prog');
}

/* Таймер считается от метки времени окончания, а не тиками setInterval:
   когда телефон гасит экран или сворачивает вкладку, интервалы тормозят —
   при возврате отдых должен быть отсчитан правильно. */
let timer={on:false,endAt:0,total:0,iv:null,fired:false};
const timeLeft=()=>Math.max(0,Math.round((timer.endAt-Date.now())/1000));

function startTimer(sec,label){
  timer.on=true; timer.total=sec; timer.endAt=Date.now()+sec*1000; timer.fired=false;
  $('#tLab').textContent=label||'Отдых между подходами';
  $('#timerbar').hidden=false;
  clearInterval(timer.iv);
  paintTimer();
  timer.iv=setInterval(tickTimer,250);
}
function tickTimer(){
  if(!timer.on) return;
  paintTimer();
  if(timeLeft()<=0 && !timer.fired){ timer.fired=true; beep(); stopTimer(); }
}
function stopTimer(){ timer.on=false; clearInterval(timer.iv); $('#timerbar').hidden=true; }
function paintTimer(){
  const m=timeLeft();
  $('#tLeft').textContent=Math.floor(m/60)+':'+pad(m%60);
  const C=2*Math.PI*16;
  $('#ringFg').setAttribute('stroke-dasharray',C);
  $('#ringFg').setAttribute('stroke-dashoffset',(C*(1-m/(timer.total||1))).toFixed(1));
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tickTimer(); });
$('#tSkip').addEventListener('click',stopTimer);
$('#tPlus').addEventListener('click',()=>{timer.endAt+=30000;timer.total=Math.max(timer.total,timeLeft());paintTimer();});

/* iOS не даёт запустить звук без жеста пользователя — поэтому аудио-контекст
   открываем и «прогреваем» на первом касании экрана, а не в момент сигнала. */
let actx=null;
function primeAudio(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    g.gain.value=0.0001; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+0.02);
  }catch(e){ actx=null; }
}
['pointerdown','touchstart','keydown'].forEach(ev=>
  document.addEventListener(ev,primeAudio,{once:true,passive:true}));

function beep(){
  if(!S.settings.sound) return;
  try{ navigator.vibrate&&navigator.vibrate([180,90,180]); }catch(e){}
  try{
    primeAudio();
    if(!actx) return;
    if(actx.state==='suspended') actx.resume();
    [0,0.22,0.44].forEach((d,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine'; o.frequency.value=i===2?1046:784;
      g.gain.setValueAtTime(0.0001,actx.currentTime+d);
      g.gain.exponentialRampToValueAtTime(0.28,actx.currentTime+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d+0.18);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime+d); o.stop(actx.currentTime+d+0.2);
    });
  }catch(e){}
}

const PLATES=[{w:25,c:'#c0392b',h:56},{w:20,c:'#1b5fd9',h:54},{w:15,c:'#d9a400',h:50},
              {w:10,c:'#2e8b57',h:44},{w:5,c:'#ffffff',h:34},{w:2.5,c:'#111418',h:28},{w:1.25,c:'#8a94a6',h:22}];
function calcPlates(total,bar){
  let side=(total-bar)/2, out=[];
  if(side<=0) return {out:[],rest:0,side:0};
  for(const p of PLATES){ while(side>=p.w-1e-9){ out.push(p); side=+(side-p.w).toFixed(3); } }
  return {out,rest:+side.toFixed(2),side:(total-bar)/2};
}

      } else { setv.done=false; persist('current'); }
      render();
    }},el('span',{html:'<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>'})));
    body.appendChild(line);
  });

  const allDone=arr.every(x=>x.done);
  if(allDone && !ex.isTime){
    const top=arr.filter(x=>x.done);
    const hitTop=top.every(x=>(+x.r)>=item.rep[1]);
    body.appendChild(el('div',{class:'hint',style:hitTop?'background:var(--good-soft);color:var(--good)':''},
      hitTop
        ? `Все подходы в верхней границе — в следующий раз ставь +${stepUp(item.id)} кг.`
        : 'Держи этот вес, пока все подходы не выйдут на верхнюю границу повторов.'));
  }
  card.appendChild(body);
  return card;
}

const UPPER=['bench','incl_db','ohp_db','latpull','row_cable','curl_bb','pushdown','hammer','lat_raise','chest_machine','facepull','row_db','pullup_assist'];
const stepUp=id=>UPPER.includes(id)?2.5:5;

function suggest(exId,i,what,item){
  const prev=lastPerf(exId);
  if(prev&&prev.sets[i]) return what==='w'?prev.sets[i].w:prev.sets[i].r;
  if(prev&&prev.sets.length) { const l=prev.sets[prev.sets.length-1]; return what==='w'?l.w:l.r; }
  if(what==='w') return EX[exId].isTime?0:20;
  return item?item.rep[0]:10;
}
function guessWeight(exId,arr){
  const v=(arr||[]).map(x=>x.w).filter(x=>x>0).pop();
  if(v) return v;
  const p=lastPerf(exId);
  return p?p.sets[p.sets.length-1].w:60;
}

      el('button',{class:'btn btn-primary btn-wide',onclick:()=>go('today')},'К тренировке')));
    root.appendChild(box); return;
  }

  /* тоннаж по неделям */
  const weeks={};
  S.sessions.forEach(s=>{
    const d=new Date(s.date); const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7));

               : 'Дневник сохраняется в этом браузере. Открой страницу в аккаунте Claude, чтобы записи синхронизировались между устройствами.'),
    el('button',{class:'btn btn-s',style:'align-self:flex-start;color:var(--bad);border-color:var(--bad)',onclick:()=>{
      if(!confirm('Удалить весь дневник? Это необратимо.'))return;
      S.sessions=[];S.body={};S.current=null;persist('sessions');persist('body');persist('current');
      if(S.db){ S.db.doc('app/body').set({e:{}}).catch(()=>{}); }
      render();
    }},'Очистить дневник')));

  root.appendChild(box);
}

/* ---------- графики ---------- */
function chartFrame(w,h,pad){
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.setAttribute('class','chart');
  return svg;
}
function niceTicks(min,max,n=3){
  if(min===max){ return [min]; }
  const span=max-min, raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||mag*10;
  const out=[]; for(let v=Math.ceil(min/step)*step; v<=max+1e-9; v+=step) out.push(+v.toFixed(6));
  return out.length?out:[min,max];
}
function lineChart(data,{unit='',color='var(--accent)'}={}){
  const W=320,H=150,PL=30,PR=8,PT=10,PB=22;
  const wrap=el('div',{class:'chart-wrap'});
  const svg=chartFrame(W,H);
  const NS='http://www.w3.org/2000/svg';
  const mk=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
  const ys=data.map(d=>d.y), lo=Math.min(...ys), hi=Math.max(...ys);
  const padY=(hi-lo)*0.18||Math.max(1,hi*0.04);
  const y0=lo-padY, y1=hi+padY;
  const X=i=>PL+(data.length<2?(W-PL-PR)/2:i*(W-PL-PR)/(data.length-1));
  const Y=v=>PT+(H-PT-PB)*(1-(v-y0)/(y1-y0||1));

  niceTicks(y0,y1,3).forEach(t=>{
    svg.appendChild(mk('line',{x1:PL,x2:W-PR,y1:Y(t),y2:Y(t),stroke:'var(--line-soft)','stroke-width':1}));
    const tx=mk('text',{x:PL-5,y:Y(t)+3,'text-anchor':'end'}); tx.textContent=Math.round(t); svg.appendChild(tx);
  });
  const d=data.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const area=d+` L${X(data.length-1).toFixed(1)} ${Y(y0)} L${X(0).toFixed(1)} ${Y(y0)} Z`;
  svg.appendChild(mk('path',{d:area,fill:color,opacity:.10,stroke:'none'}));
  svg.appendChild(mk('path',{d,fill:'none',stroke:color,'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'}));
  data.forEach((p,i)=>{
    const last=i===data.length-1;
    svg.appendChild(mk('circle',{cx:X(i),cy:Y(p.y),r:last?4.5:3,fill:last?color:'var(--card)',stroke:color,'stroke-width':2}));
  });
  [0,data.length-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{
    const tx=mk('text',{x:X(i),y:H-6,'text-anchor':i===0?'start':'end'}); tx.textContent=fmtDate(data[i].x); svg.appendChild(tx);
  });
  const lastT=mk('text',{x:X(data.length-1),y:Y(data[data.length-1].y)-9,'text-anchor':'end',fill:'var(--ink)','font-weight':'600'});
  lastT.textContent=data[data.length-1].y+unit; svg.appendChild(lastT);

  const tip=el('div',{class:'tip'});
  const hit=mk('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});
  svg.appendChild(hit);
  const cross=mk('line',{stroke:'var(--ink-3)','stroke-width':1,'stroke-dasharray':'3 3',opacity:0});
  svg.appendChild(cross);
  function at(e){
    const r=svg.getBoundingClientRect();
    const px=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*W;
    let i=0,best=1e9;
    data.forEach((p,k)=>{const dd=Math.abs(X(k)-px); if(dd<best){best=dd;i=k;}});
    cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));
    cross.setAttribute('y1',PT);cross.setAttribute('y2',H-PB);cross.setAttribute('opacity',.5);
    tip.textContent=`${fmtDate(data[i].x)} · ${data[i].y}${unit}`+(data[i].raw?` (${data[i].raw})`:'');
    tip.style.left=(X(i)/W*100)+'%'; tip.style.top=(Y(data[i].y)/H*100)+'%';
    tip.classList.add('on');
  }
  svg.addEventListener('mousemove',at); svg.addEventListener('touchmove',e=>{at(e);},{passive:true});
  svg.addEventListener('touchstart',at,{passive:true});
  svg.addEventListener('mouseleave',()=>{tip.classList.remove('on');cross.setAttribute('opacity',0);});
  wrap.append(svg,tip);
  return wrap;
}
function barChart(data,{unit='',color='var(--signal)'}={}){
  const W=320,H=130,PL=34,PR=6,PT=10,PB=20;
  const wrap=el('div',{class:'chart-wrap'});
  const NS='http://www.w3.org/2000/svg';
  const svg=chartFrame(W,H);
  const mk=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
  const hi=Math.max(...data.map(d=>d.y),1);
  const Y=v=>PT+(H-PT-PB)*(1-v/hi);
  const bw=Math.min(26,(W-PL-PR)/data.length-4);
  niceTicks(0,hi,2).forEach(t=>{
    svg.appendChild(mk('line',{x1:PL,x2:W-PR,y1:Y(t),y2:Y(t),stroke:'var(--line-soft)','stroke-width':1}));
    const tx=mk('text',{x:PL-5,y:Y(t)+3,'text-anchor':'end'}); tx.textContent=t>=1000?Math.round(t/1000)+'к':Math.round(t); svg.appendChild(tx);
  });
  const tip=el('div',{class:'tip'});
  data.forEach((p,i)=>{
    const x=PL+i*((W-PL-PR)/data.length)+((W-PL-PR)/data.length-bw)/2;
    const r=mk('rect',{x,y:Y(p.y),width:bw,height:Math.max(2,H-PB-Y(p.y)),rx:4,fill:color,opacity:i===data.length-1?1:.55});
    r.addEventListener('mouseenter',()=>{tip.textContent=`Неделя ${fmtDate(p.x)} · ${p.y.toLocaleString('ru-RU')}${unit}`;
      tip.style.left=((x+bw/2)/W*100)+'%'; tip.style.top=(Y(p.y)/H*100)+'%'; tip.classList.add('on');});
    r.addEventListener('mouseleave',()=>tip.classList.remove('on'));
    svg.appendChild(r);
    if(i===0||i===data.length-1){
      const tx=mk('text',{x:x+bw/2,y:H-5,'text-anchor':'middle'}); tx.textContent=fmtDate(p.x); svg.appendChild(tx);
    }
  });
  wrap.append(svg,tip);
  return wrap;
}

/* ---------- Питание ---------- */
function renderFood(){
  const root=$('#scr-food'); root.innerHTML='';
  const p=S.settings.profile;
  $('#scrSub').textContent='Расчёт нормы для набора массы';
  const box=el('div',{class:'stack'});

  const bmr=(p.sex==='m'? 10*p.weight+6.25*p.height-5*p.age+5 : 10*p.weight+6.25*p.height-5*p.age-161);
  const tdee=bmr*p.act;
  const surplus={easy:0.08,steady:0.13,fast:0.20}[p.pace]||0.13;
  const kcal=Math.round((tdee*(1+surplus))/10)*10;
  const prot=Math.round(p.weight*2.0);
  const fat=Math.round(p.weight*0.9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const gain=(p.weight*(surplus<0.1?0.0025:surplus<0.16?0.0035:0.005));

  box.appendChild(el('div',{class:'hero'},
    el('div',{class:'eyebrow'},'Твоя норма на массу'),
    el('div',{class:'hero-title',style:'font-size:38px'},kcal.toLocaleString('ru-RU'),el('span',{style:'font-size:16px;font-weight:600;margin-left:6px'},'ккал/день')),
    el('div',{class:'hero-sub'},`Поддержка ${Math.round(tdee)} ккал · профицит +${Math.round(kcal-tdee)} ккал`),
    el('div',{class:'hero-stats'},
      el('div',{class:'hero-stat'},el('b',{},prot+' г'),el('span',{},'белок')),
      el('div',{class:'hero-stat'},el('b',{},fat+' г'),el('span',{},'жиры')),
      el('div',{class:'hero-stat'},el('b',{},carb+' г'),el('span',{},'углеводы')),
      el('div',{class:'hero-stat'},el('b',{},'+'+gain.toFixed(2)),el('span',{},'кг в неделю'))
    )));

  box.appendChild(el('div',{class:'card'},
    el('div',{class:'eyebrow'},'Как распределяются калории'),
    el('div',{class:'bar-track'},
      el('i',{style:`width:${prot*4/kcal*100}%;background:var(--accent)`}),
      el('i',{style:`width:${fat*9/kcal*100}%;background:var(--signal)`}),
      el('i',{style:`width:${carb*4/kcal*100}%;background:var(--good)`})),
    el('div',{class:'row',style:'gap:14px;margin-top:9px;font-size:11.5px;flex-wrap:wrap'},
      el('span',{class:'row',style:'gap:5px'},el('i',{style:'width:9px;height:9px;border-radius:3px;background:var(--accent);display:block'}),'Белок'),
      el('span',{class:'row',style:'gap:5px'},el('i',{style:'width:9px;height:9px;border-radius:3px;background:var(--signal);display:block'}),'Жиры'),
      el('span',{class:'row',style:'gap:5px'},el('i',{style:'width:9px;height:9px;border-radius:3px;background:var(--good);display:block'}),'Углеводы'))));

  const F=(label,key,attrs={})=>el('div',{class:'field'},
    el('label',{for:'f-'+key},label),
    el('input',{id:'f-'+key,type:'number',inputmode:'numeric',value:p[key],...attrs,
      oninput:e=>{p[key]=parseFloat(e.target.value)||p[key];persist('settings');renderFood();}}));

  box.appendChild(el('div',{class:'card stack'},
    el('div',{class:'eyebrow'},'Твои данные'),
    el('div',{class:'grid2'},F('Возраст','age'),F('Рост, см','height')),
    el('div',{class:'grid2'},
      F('Вес, кг','weight',{step:'0.1'}),
      el('div',{class:'field'},el('label',{for:'f-sex'},'Пол'),
        el('select',{id:'f-sex',onchange:e=>{p.sex=e.target.value;persist('settings');renderFood();}},
          el('option',{value:'m',selected:p.sex==='m'?true:null},'Мужской'),
          el('option',{value:'f',selected:p.sex==='f'?true:null},'Женский')))),
    el('div',{class:'field'},el('label',{for:'f-act'},'Активность вне зала'),
      el('select',{id:'f-act',onchange:e=>{p.act=+e.target.value;persist('settings');renderFood();}},
        el('option',{value:1.2,selected:p.act===1.2?true:null},'Сидячая работа, мало хожу'),
        el('option',{value:1.375,selected:p.act===1.375?true:null},'Обычный день + 3 тренировки'),
        el('option',{value:1.55,selected:p.act===1.55?true:null},'Много хожу + 4–5 тренировок'),
        el('option',{value:1.725,selected:p.act===1.725?true:null},'Физическая работа'))),
    el('div',{class:'field'},el('label',{for:'f-pace'},'Темп набора'),
      el('select',{id:'f-pace',onchange:e=>{p.pace=e.target.value;persist('settings');renderFood();}},
        el('option',{value:'easy',selected:p.pace==='easy'?true:null},'Аккуратный — минимум жира'),
        el('option',{value:'steady',selected:p.pace==='steady'?true:null},'Рабочий — оптимально для новичка'),
        el('option',{value:'fast',selected:p.pace==='fast'?true:null},'Быстрый — быстрее вес, больше жира')))
  ));

  box.appendChild(el('div',{class:'card stack-s'},
    el('div',{class:'eyebrow'},'Что это значит на практике'),
    el('div',{class:'nut-row'},el('span',{},'Белок в день'),el('b',{},prot+' г')),
    el('div',{class:'muted',style:'font-size:12.5px;margin-top:-4px'},
      `Это примерно ${Math.round(prot/25)} порций по 25 г: 120 г куриной грудки, 150 г творога 5%, 3 яйца или порция протеина — каждая даёт около 25 г.`),
    el('hr',{class:'sep'}),
    el('div',{class:'nut-row'},el('span',{},'Приёмов пищи'),el('b',{},'4–5')),
    el('div',{class:'muted',style:'font-size:12.5px;margin-top:-4px'},
      `По ${Math.round(kcal/4/10)*10}–${Math.round(kcal/5/10)*10} ккал и 30–40 г белка за приём. Равномерно по дню — так белок усваивается лучше, чем одной большой порцией.`),
    el('hr',{class:'sep'}),
    el('div',{class:'nut-row'},el('span',{},'Вокруг тренировки'),el('b',{},'углеводы')),
    el('div',{class:'muted',style:'font-size:12.5px;margin-top:-4px'},
      'За 1,5–2 часа до зала — приём с углеводами и белком. После — обычный полноценный приём пищи в течение пары часов. «Анаболическое окно» в 30 минут — миф.'),
    el('hr',{class:'sep'}),
    el('div',{class:'nut-row'},el('span',{},'Вода'),el('b',{},(p.weight*0.035).toFixed(1)+' л')),
    el('div',{class:'muted',style:'font-size:12.5px;margin-top:-4px'},'Плюс 0,5–1 л в день тренировки.')
  ));

  box.appendChild(el('div',{class:'card stack-s'},
    el('div',{class:'eyebrow'},'Проверка раз в 2 недели'),
    el('div',{style:'font-size:13.5px;line-height:1.5'},
      'Взвешивайся утром натощак и смотри на среднее за неделю. Если за 2 недели вес не вырос — добавь 200 ккал в день. ',
      'Если растёт быстрее ',el('b',{},(p.weight*0.006).toFixed(2)+' кг в неделю'),' — убери 150 ккал, иначе набирается лишний жир.'),
    el('button',{class:'btn btn-s',style:'align-self:flex-start',onclick:()=>go('prog')},'Записать вес')));

  box.appendChild(el('div',{class:'card stack-s'},
    el('div',{class:'eyebrow'},'Сон и восстановление'),
    el('div',{style:'font-size:13.5px;line-height:1.5'},
      'Мышцы растут не в зале, а во сне. 7–9 часов — это часть программы, а не «если получится». ',
      'При недосыпе падают рабочие веса и растёт доля жира в наборе.')));

  box.appendChild(el('div',{class:'card stack-s'},
    el('div',{class:'eyebrow'},'Настройки'),
    el('div',{class:'spread'},
      el('span',{style:'font-size:13.5px'},'Звук и вибрация таймера'),
      el('button',{class:'chip','aria-pressed':S.settings.sound,onclick:()=>{S.settings.sound=!S.settings.sound;persist('settings');if(S.settings.sound)beep();renderFood();}},
        S.settings.sound?'Включён':'Выключен')),
    el('hr',{class:'sep'}),
    el('div',{style:'font-size:12.5px;line-height:1.5',class:'muted'},
      el('b',{style:'color:var(--ink)'},'Добавь на экран телефона: '),
      'в Safari — «Поделиться» → «На экран „Домой“». В Chrome на Android — меню «⋮» → «Добавить на главный экран». Приложение откроется без адресной строки.')));

  box.appendChild(el('div',{class:'muted',style:'font-size:11.5px;line-height:1.5;padding:0 2px 8px'},
    'Расчёт по формуле Миффлина–Сан Жеора — это оценка, а не медицинская рекомендация. При хронических заболеваниях, травмах или приёме лекарств сначала посоветуйся с врачом.'));

  root.appendChild(box);
}
