# Тоннаж — конфигурация nginx
#
# HTTPS здесь не украшение: без него Safari не даст поставить приложение
# на экран «Домой», не включит service worker и, значит, не даст работать
# офлайн. Сертификат бесплатный, ставится одной командой certbot.
#
# Положить в /etc/nginx/sites-available/tonnage,
# затем: ln -s /etc/nginx/sites-available/tonnage /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name ТВОЙ-ДОМЕН;

    # Единственное, что остаётся на HTTP — проверка сертификата
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ТВОЙ-ДОМЕН;

    ssl_certificate     /etc/letsencrypt/live/ТВОЙ-ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ТВОЙ-ДОМЕН/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Дневник целиком помещается в пару мегабайт, но запас не мешает
    client_max_body_size 8m;

    # Ограничение на вход: защита от перебора пароля
    limit_req_zone $binary_remote_addr zone=tonnage_login:10m rate=10r/m;

    location /api/login {
        limit_req zone=tonnage_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;
}
